services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a2y-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://a2y:${DB_PASSWORD}@db:5432/a2y_prospeccao
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    volumes:
      - a2y_uploads:/app/uploads
    ports:
      - "127.0.0.1:3011:3000"
    networks:
      - default
      - shared_caddy_net

  db:
    image: postgres:16-alpine
    container_name: a2y-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: a2y
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: a2y_prospeccao
    volumes:
      - a2y_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2y -d a2y_prospeccao"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

networks:
  shared_caddy_net:
    external: true

volumes:
  a2y_postgres_data:
  a2y_uploads:
